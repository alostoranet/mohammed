name: Build Windows application

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Windows x64 dependencies
        run: dotnet restore src/Alostora.RestHouse/Alostora.RestHouse.csproj --runtime win-x64

      - name: Build
        run: dotnet build src/Alostora.RestHouse/Alostora.RestHouse.csproj --configuration Release --runtime win-x64 --no-restore

      - name: Publish self-contained Windows x64 application
        run: dotnet publish src/Alostora.RestHouse/Alostora.RestHouse.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore

      - name: Upload Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: ALOSTORA-REST-HOUSE-Windows-x64
          path: src/Alostora.RestHouse/bin/Release/net8.0-windows/win-x64/publish/
          if-no-files-found: error
          retention-days: 14
